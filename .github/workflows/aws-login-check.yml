name: aws-login-check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::886126521431:role/github-actions-dev
          aws-region: us-east-1
      - name: Who am I
        run: aws sts get-caller-identity