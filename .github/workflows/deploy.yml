name: deploy-dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::886126521431:role/github-actions-dev-deploy
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/envs/dev
        run: terraform init -input=false

      - name: Create ECR repo first
        working-directory: infra/envs/dev
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.api -var image_tag=${{ github.sha }}

      - name: Build and push image
        working-directory: infra/envs/dev
        run: |
          REPO_URL=$(terraform state pull | jq -r '.resources[] | select(.type=="aws_ecr_repository" and .name=="api") | .instances[0].attributes.repository_url')
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO_URL%%/*}"
          docker build -t "$REPO_URL:${{ github.sha }}" ../../../app
          docker push "$REPO_URL:${{ github.sha }}"

      - name: Terraform apply
        working-directory: infra/envs/dev
        run: terraform apply -input=false -auto-approve -var image_tag=${{ github.sha }}

      - name: Ensure the API key has a value
        run: |
          SECRET_ID=fhir-poc-dev/api-key
          if ! aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text > /dev/null 2>&1; then
            echo "No secret value found. Setting a new random one."
            aws secretsmanager put-secret-value --secret-id "$SECRET_ID" --secret-string "$(openssl rand -hex 24)" > /dev/null
            CL=$(aws ecs list-clusters --query 'clusterArns[0]' --output text)
            SV=$(aws ecs list-services --cluster "$CL" --query 'serviceArns[0]' --output text)
            aws ecs update-service --cluster "$CL" --service "$SV" --force-new-deployment > /dev/null
          fi

      - name: Smoke test
        working-directory: infra/envs/dev
        run: |
          URL="http://$(terraform output -raw alb_dns_name)/health"
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors "$URL"